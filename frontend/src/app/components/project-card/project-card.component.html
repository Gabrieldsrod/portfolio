<article class="group relative flex flex-col h-full rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800/80 overflow-hidden shadow-sm hover:shadow-xl hover:border-red-600/50 dark:hover:border-red-500/50 transition-all duration-300 transform hover:-translate-y-1">
  
  <!-- Project Cover Image with Hover Zoom -->
  <div class="relative w-full h-48 sm:h-52 overflow-hidden bg-zinc-800">
    <img
      [src]="displayImageUrl"
      [alt]="projectTitle"
      (error)="onImageError()"
      width="400"
      height="225"
      decoding="async"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
      loading="lazy" />
    
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-zinc-950/20 to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>

    <!-- Featured Badge -->
    <div *ngIf="project.featured" class="absolute top-3 left-3">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-red-600 text-white shadow-md">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span>Destaque</span>
      </span>
    </div>
  </div>

  <!-- Card Body Content -->
  <div class="flex flex-col flex-1 p-6 space-y-4">
    
    <!-- Title -->
    <h3 class="text-xl font-bold text-zinc-900 dark:text-white group-hover:text-red-600 dark:group-hover:text-red-500 transition-colors">
      {{ projectTitle }}
    </h3>

    <!-- Description -->
    <p class="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed flex-1">
      {{ projectDescription }}
    </p>

    <!-- Tech Badges -->
    <div class="flex flex-wrap gap-1.5 pt-2">
      <span
        *ngFor="let tech of project.technologies"
        class="px-2.5 py-1 rounded-md text-xs font-mono font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200/80 dark:border-zinc-700/60">
        {{ tech }}
      </span>
    </div>

    <!-- Links Action Buttons -->
    <div class="flex items-center gap-3 pt-4 border-t border-zinc-100 dark:border-zinc-800/80">
      
      <!-- GitHub Link -->
      <a
        *ngIf="project.githubUrl"
        [href]="project.githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="flex-1 py-2 px-3 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 text-xs font-semibold flex items-center justify-center gap-2 transition-colors">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>{{ lang.t().projects.viewCode }}</span>
      </a>

      <!-- Live Deploy Link -->
      <a
        *ngIf="project.deployUrl"
        [href]="project.deployUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="flex-1 py-2 px-3 rounded-lg bg-red-600/10 hover:bg-red-600 text-red-600 hover:text-white dark:text-red-400 dark:hover:text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
        <span>{{ lang.t().projects.viewDeploy }}</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>

    </div>

  </div>
</article>
