<header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md bg-white/80 dark:bg-[#0F0F12]/80 border-b border-zinc-200/80 dark:border-zinc-800/80 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Logo / Name -->
    <a href="#" class="group flex items-center gap-1.5 text-lg sm:text-xl font-bold tracking-tight text-zinc-900 dark:text-white transition">
      <span>Gabrieldsrod<span class="text-red-600 dark:text-red-500 font-extrabold">.dev</span></span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
      <a href="#about" class="text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">
        {{ lang.t().nav.about }}
      </a>
      <a href="#stack" class="text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">
        {{ lang.t().nav.stack }}
      </a>
      <a href="#projects" class="text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">
        {{ lang.t().nav.projects }}
      </a>
      <a href="#contact" class="text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">
        {{ lang.t().nav.contact }}
      </a>
    </nav>

    <!-- Right Controls: Theme Toggle + i18n Switcher + Mobile Menu Button -->
    <div class="flex items-center gap-3 sm:gap-4">
      
      <!-- Language Toggle Button -->
      <button
        (click)="lang.toggleLanguage()"
        type="button"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-zinc-100 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-800 hover:border-zinc-400 dark:hover:border-zinc-700 transition-all cursor-pointer"
        aria-label="Alternar Idioma / Toggle Language">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span [class.font-bold]="lang.currentLang() === 'pt'" [class.text-zinc-900]="lang.currentLang() === 'pt'" [class.dark:text-white]="lang.currentLang() === 'pt'">PT</span>
        <span class="text-zinc-400">|</span>
        <span [class.font-bold]="lang.currentLang() === 'en'" [class.text-zinc-900]="lang.currentLang() === 'en'" [class.dark:text-white]="lang.currentLang() === 'en'">EN</span>
      </button>

      <!-- Dark / Light Theme Toggle -->
      <button
        (click)="theme.toggleTheme()"
        type="button"
        class="p-2 rounded-full bg-zinc-100 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-800 hover:text-zinc-900 dark:hover:text-white hover:border-zinc-400 dark:hover:border-zinc-700 transition-all cursor-pointer"
        [attr.aria-label]="theme.isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'">
        
        <!-- Sun Icon (shown in dark mode) -->
        <svg *ngIf="theme.isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>

        <!-- Moon Icon (shown in light mode) -->
        <svg *ngIf="!theme.isDarkMode()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>

      <!-- Mobile Hamburger Button -->
      <button
        (click)="mobileMenuOpen.set(!mobileMenuOpen())"
        type="button"
        class="md:hidden p-2 rounded-lg text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition"
        aria-label="Abrir menu">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path *ngIf="!mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

    </div>

  </div>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="mobileMenuOpen()" class="md:hidden border-b border-zinc-200 dark:border-zinc-800 bg-white/95 dark:bg-[#0F0F12]/95 backdrop-blur-lg px-4 pt-3 pb-5 space-y-3">
    <a (click)="mobileMenuOpen.set(false)" href="#about" class="block py-2 text-base font-medium text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
      {{ lang.t().nav.about }}
    </a>
    <a (click)="mobileMenuOpen.set(false)" href="#stack" class="block py-2 text-base font-medium text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
      {{ lang.t().nav.stack }}
    </a>
    <a (click)="mobileMenuOpen.set(false)" href="#projects" class="block py-2 text-base font-medium text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
      {{ lang.t().nav.projects }}
    </a>
    <a (click)="mobileMenuOpen.set(false)" href="#contact" class="block py-2 text-base font-medium text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white">
      {{ lang.t().nav.contact }}
    </a>
  </div>
</header>
