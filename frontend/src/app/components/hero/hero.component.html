<section #heroSection class="relative min-h-[90vh] flex items-center justify-center pt-28 pb-16 overflow-hidden select-none">
  
  <!-- 1. Technical Dynamic Grid Background Pattern -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:32px_32px] [mask-image:radial-gradient(ellipse_75%_60%_at_50%_40%,#000_60%,transparent_100%)] pointer-events-none z-0"></div>

  <!-- 2. Interactive Canvas Particles & Constellation Layer -->
  <canvas #heroCanvas class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- 3. Muted Ambient Accent Blobs -->
  <div class="absolute top-1/4 left-1/6 w-96 h-96 sm:w-120 sm:h-120 bg-red-600/5 dark:bg-red-600/8 rounded-full blur-[140px] pointer-events-none animate-blob-1 z-0"></div>
  <div class="absolute bottom-10 right-1/8 w-80 h-80 sm:w-110 sm:h-110 bg-zinc-400/10 dark:bg-zinc-700/10 rounded-full blur-[140px] pointer-events-none animate-blob-2 z-0"></div>
  <div class="absolute -top-12 right-1/4 w-72 h-72 sm:w-96 sm:h-96 bg-rose-600/5 dark:bg-rose-600/5 rounded-full blur-[120px] pointer-events-none animate-blob-3 z-0"></div>

  <!-- Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
      
      <!-- LEFT COLUMN: Text & CTAs -->
      <div class="lg:col-span-7 space-y-8 text-center lg:text-left order-2 lg:order-1">
        
        <!-- Title & Role -->
        <div class="space-y-3">
          <p class="text-xs sm:text-sm uppercase tracking-widest text-zinc-500 dark:text-zinc-400 font-semibold">
            {{ lang.t().hero.greeting }}
          </p>
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-zinc-900 dark:text-white tracking-tight leading-tight">
            {{ lang.t().hero.name }}
          </h1>
          <h2 class="text-xl sm:text-2xl md:text-3xl font-semibold text-zinc-700 dark:text-zinc-300">
            {{ lang.t().hero.role }}
          </h2>
        </div>

        <!-- Summary Bio -->
        <p class="max-w-2xl mx-auto lg:mx-0 text-base sm:text-lg text-zinc-600 dark:text-zinc-400 leading-relaxed">
          {{ lang.t().hero.summary }}
        </p>

        <!-- Action Buttons (CTAs) -->
        <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-2">
          <a
            href="#projects"
            class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold text-sm shadow-md shadow-red-600/20 hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
            <span>{{ lang.t().hero.ctaProjects }}</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m0 0l6-6m-6 6l-6-6" />
            </svg>
          </a>
        </div>

        <!-- Social Links -->
        <div class="flex items-center justify-center lg:justify-start gap-4 pt-4 text-zinc-600 dark:text-zinc-400">
          <a href="https://github.com/Gabrieldsrod" target="_blank" rel="noopener noreferrer"
             class="p-3 rounded-full bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 hover:text-zinc-900 dark:hover:text-white hover:border-zinc-400 dark:hover:border-zinc-700 transition-all hover:scale-110"
             title="GitHub Profile">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </a>

          <a href="https://www.linkedin.com/in/gabrieldsrod/" target="_blank" rel="noopener noreferrer"
             class="p-3 rounded-full bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 hover:text-zinc-900 dark:hover:text-white hover:border-zinc-400 dark:hover:border-zinc-700 transition-all hover:scale-110"
             title="LinkedIn Profile">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
          </a>

          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=gabrieldsrodrigues19@gmail.com"
             target="_blank"
             rel="noopener noreferrer"
             (click)="onEmailClick($event)"
             class="relative p-3 rounded-full bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 hover:text-zinc-900 dark:hover:text-white hover:border-zinc-400 dark:hover:border-zinc-700 transition-all hover:scale-110"
             title="gabrieldsrodrigues19@gmail.com">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <span *ngIf="copiedEmail()" class="absolute -bottom-8 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-[10px] font-sans font-bold shadow-lg whitespace-nowrap z-20">
              {{ lang.t().contact.emailCopied }}
            </span>
          </a>
        </div>

      </div>

      <!-- RIGHT COLUMN: Profile Photo Frame -->
      <div class="lg:col-span-5 flex justify-center order-1 lg:order-2">
        <div class="relative group">
          <!-- Main Frame Container with Subtle Neutral 1px Border & Soft Shadow -->
          <div class="relative w-64 h-64 sm:w-80 sm:h-80 lg:w-88 lg:h-88 rounded-3xl overflow-hidden bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 shadow-xl flex items-center justify-center">
            <img
              [src]="profileImageUrl"
              (error)="onImageError()"
              alt="Gabriel da Silva Rodrigues"
              width="352"
              height="352"
              loading="eager"
              fetchpriority="high"
              decoding="async"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
