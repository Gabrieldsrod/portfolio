<div
  (click)="onBackdropClick($event)"
  class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-zinc-950/60 dark:bg-black/80 backdrop-blur-md transition-opacity duration-300"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="projectTitle">

  <div class="relative w-full max-w-4xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] transition-colors duration-200">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-200 dark:border-zinc-800 bg-zinc-50/90 dark:bg-zinc-900/90 transition-colors">
      <div class="flex items-center gap-2.5 min-w-0 pr-4">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-red-600/10 text-red-600 dark:text-red-500 shrink-0">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
          </svg>
        </span>
        <h3 class="text-base sm:text-lg font-bold text-zinc-900 dark:text-white truncate">
          {{ projectTitle }}
        </h3>
      </div>

      <button
        (click)="close()"
        type="button"
        [attr.aria-label]="lang.t().projects.closeModal"
        class="p-2 rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-200/70 dark:hover:bg-zinc-800 transition-colors cursor-pointer shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Video Embed Area (16:9 ratio) -->
    <div class="relative w-full aspect-video bg-black flex items-center justify-center">
      <iframe
        *ngIf="safeEmbedUrl; else nonEmbedTemplate"
        [src]="safeEmbedUrl"
        class="w-full h-full border-0"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>

      <ng-template #nonEmbedTemplate>
        <div class="p-8 text-center space-y-4 bg-zinc-100 dark:bg-zinc-900 w-full h-full flex flex-col items-center justify-center">
          <p class="text-sm text-zinc-600 dark:text-zinc-400">
            {{ lang.currentLang() === 'pt' ? 'O link informado não é um vídeo do YouTube compatível com exibição direta.' : 'The provided link is not a YouTube video compatible with direct embed.' }}
          </p>
          <a
            *ngIf="rawVideoUrl"
            [href]="rawVideoUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-semibold shadow-md transition-colors">
            <span>{{ lang.t().projects.watchOnYoutube }}</span>
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </ng-template>
    </div>

    <!-- Modal Footer -->
    <div class="flex items-center justify-between gap-3 px-5 py-3.5 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50/90 dark:bg-zinc-900/90 text-xs transition-colors">
      <a
        *ngIf="directYouTubeUrl"
        [href]="directYouTubeUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white transition-colors group">
        <svg class="w-4 h-4 fill-red-600 dark:fill-red-500 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
        </svg>
        <span class="font-medium underline underline-offset-2">{{ lang.t().projects.watchOnYoutube }}</span>
      </a>

      <button
        (click)="close()"
        type="button"
        class="ml-auto px-4 py-2 rounded-xl bg-zinc-200 hover:bg-zinc-300 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 text-xs font-semibold transition-colors cursor-pointer">
        {{ lang.t().projects.closeModal }}
      </button>
    </div>

  </div>
</div>
